<style>
/* Layout: full-bleed WebGL canvas with a thin HUD and one centered card for start / game over. */
:root{
  --ink:#0b0e13; --panel:rgba(12,16,22,.82); --line:rgba(127,227,214,.3);
  --jade:#7fe3d6; --paper:#efe6d2; --muted:#b4c0c4; --lamp:#ffd27a;
  --display:'Cinzel',Georgia,serif; --body:'Alegreya Sans',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-variant-numeric:tabular-nums}
#hud .box{background:rgba(10,14,20,.55);padding:6px 12px;border:1px solid rgba(239,230,210,.15)}
#score{font-family:var(--display);font-size:22px;letter-spacing:.06em}
#lamps{color:var(--lamp);font-size:17px;font-weight:500}
#card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,7,10,.45)}
#card[hidden]{display:none}
.panel{background:var(--panel);border:1px solid var(--line);padding:24px 26px;width:min(420px,calc(100% - 32px));box-sizing:border-box;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.3em;color:var(--jade);margin:0}
h1{font-family:var(--display);margin:0;font-size:30px;letter-spacing:.1em}
p{margin:0;color:var(--muted);line-height:1.5}
button{font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:14px;color:var(--jade);background:linear-gradient(180deg,#173a39,#0f2626);border:1px solid var(--jade);padding:11px 30px;cursor:pointer;text-transform:uppercase}
button:focus-visible{outline:2px solid var(--jade);outline-offset:3px}
.keys{font-size:13px}
.keys kbd{font-family:var(--body);border:1px solid rgba(180,192,196,.4);border-bottom-width:2px;padding:0 5px;border-radius:3px;color:var(--paper)}
#tag{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));font-size:12px;color:rgba(239,230,210,.6);pointer-events:none}
</style></head><body>

<canvas id="gl"></canvas>
<div id="hud"><div class="box"><div id="score">0 m</div></div><div class="box" id="lamps">Lamps 0</div></div>
<div id="card">
  <div class="panel">
    <p class="eyebrow" id="eyebrow">Animation test</p>
    <h1 id="headline">Tenzin Run</h1>
    <p id="msg">Tenzin's run is a looping cut-out of the rope-bridge shot from Arkizen Studio's morning-run animation.</p>
    <p class="keys"><kbd>←</kbd> <kbd>→</kbd> change lane · <kbd>Space</kbd> or <kbd>↑</kbd> jump · swipe on a phone</p>
    <button id="go">Run</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const SKY_TOP = new THREE.Color('#3a5f9c'), SKY_LOW = new THREE.Color('#f2c9a0');
scene.fog = new THREE.Fog('#d9c6b4', 30, 120);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 400);
camera.position.set(0, 3.3, 6.2);
camera.lookAt(0, 1.0, -10);

/* ---------- textures drawn in canvas ---------- */
function canvasTex(w, h, draw, rep){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  if (rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}
const rnd = (a=1,b) => b === undefined ? Math.random()*a : a + Math.random()*(b-a);
// sky gradient + mountains as the backdrop
const skyTex = canvasTex(1024, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#2c4c86'); gr.addColorStop(0.3, '#7d9cc6'); gr.addColorStop(0.5, '#f0c9a2'); gr.addColorStop(1, '#f5dcc0');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const sun = g.createRadialGradient(w*0.62, h*0.4, 0, w*0.62, h*0.4, 200); sun.addColorStop(0, 'rgba(255,236,190,.95)'); sun.addColorStop(1, 'rgba(255,220,170,0)');
  g.fillStyle = sun; g.fillRect(0, 0, w, h);
  const ridge = (base, amp, col, snow, seed) => {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, h);
    const pts = [];
    for (let x = 0; x <= w; x += 6){ const y = base - amp*(0.55*Math.abs(Math.sin(x*0.006 + seed)) + 0.3*Math.abs(Math.sin(x*0.017 + seed*2)) + 0.15*Math.sin(x*0.05 + seed)); pts.push([x,y]); g.lineTo(x, y); }
    g.lineTo(w, h); g.fill();
    g.fillStyle = snow; g.beginPath();
    pts.forEach((p,i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
    for (let i = pts.length-1; i >= 0; i--) g.lineTo(pts[i][0], Math.max(pts[i][1], base - amp*0.55 + Math.sin(i)*5));
    g.fill();
  };
  ridge(h*0.5, 150, '#6c80a8', 'rgba(245,240,240,.95)', 1.3);
  ridge(h*0.56, 90, '#526590', 'rgba(240,225,220,.85)', 4.1);
  g.fillStyle = '#f6ece2'; g.fillRect(0, h*0.56, w, h);
});
scene.background = skyTex;

const stoneTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#8f8a83'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++){
    const x = c*86 + (r%2)*40 - 20, y = r*64;
    g.fillStyle = `hsl(30, ${6+rnd(6)}%, ${48+rnd(12)}%)`; g.fillRect(x+3, y+3, 80, 58);
    g.fillStyle = 'rgba(0,0,0,.08)'; g.fillRect(x+3, y+52, 80, 9);
  }
}, [1, 2]);
const woodTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#7a5235'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++){ g.strokeStyle = `rgba(40,22,10,${rnd(.1,.3)})`; g.beginPath(); const y = rnd(h); g.moveTo(0, y); g.bezierCurveTo(w*0.3, y+rnd(-6,6), w*0.6, y+rnd(-6,6), w, y+rnd(-4,4)); g.stroke(); }
});
const wallTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#ece3d0'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#6f2131'; g.fillRect(0, 0, w, 40);
  g.fillStyle = '#3b2a20'; g.fillRect(0, 0, w, 10);
  for (let i = 0; i < 6; i++){ const gr = g.createLinearGradient(0, 40, 0, 200); gr.addColorStop(0, 'rgba(110,80,55,.18)'); gr.addColorStop(1, 'rgba(110,80,55,0)'); g.fillStyle = gr; g.fillRect(rnd(w), 40, rnd(4,12), 160); }
  g.fillStyle = '#2a1d18'; g.fillRect(100, 110, 50, 70); g.strokeStyle = '#5c3a26'; g.lineWidth = 8; g.strokeRect(100, 110, 50, 70); g.fillStyle = '#b8402f'; g.fillRect(92, 98, 66, 10);
});
const lampTex = canvasTex(64, 64, (g, w, h) => {
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,235,170,1)'); gr.addColorStop(0.35, 'rgba(255,200,90,.7)'); gr.addColorStop(1, 'rgba(255,190,80,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight('#dfe8ff', '#7a6050', 0.85));
const sunL = new THREE.DirectionalLight('#ffe2bf', 0.9); sunL.position.set(-6, 12, 4); scene.add(sunL);

/* ---------- cloud sea ---------- */
const cloud = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshBasicMaterial({ color:'#f6ece2', fog:true }));
cloud.rotation.x = -Math.PI/2; cloud.position.y = -7; scene.add(cloud);
const puffMat = new THREE.MeshBasicMaterial({ color:'#ffffff', transparent:true, opacity:0.85 });
const puffs = [];
for (let i = 0; i < 40; i++){
  const m = new THREE.Mesh(new THREE.SphereGeometry(rnd(3,7), 12, 8), puffMat);
  m.scale.y = 0.4; m.position.set((Math.random()<0.5?-1:1)*rnd(10,40), -6 + rnd(1.5), -rnd(0,160)); scene.add(m); puffs.push(m);
}

/* ---------- track ---------- */
const LANE = 1.7, SEG = 8, NSEG = 20;
const world = new THREE.Group(); scene.add(world);
const floorGeo = new THREE.BoxGeometry(5.8, 0.5, SEG);
const floorMat = new THREE.MeshLambertMaterial({ map:stoneTex });
const woodMat = new THREE.MeshLambertMaterial({ map:woodTex });
const ropeMat = new THREE.MeshLambertMaterial({ color:'#c7b08a' });
const wallMat = new THREE.MeshLambertMaterial({ map:wallTex });
const roofMat = new THREE.MeshLambertMaterial({ color:'#3b2a20' });
const goldMat = new THREE.MeshLambertMaterial({ color:'#d8a63a' });
const FLAGS = ['#2f63b8','#f4f1ea','#c8352e','#2f8a4c','#e6b52c'].map(c => new THREE.MeshBasicMaterial({ color:c, side:THREE.DoubleSide, fog:true }));
const segs = [];
function makeSeg(z, i){
  const g = new THREE.Group(); g.position.z = z;
  const floor = new THREE.Mesh(floorGeo, floorMat); floor.position.y = -0.25; g.add(floor);
  // posts + rope rails
  for (const side of [-1, 1]){
    for (const pz of [-SEG/2+0.3, 0.3]){ const post = new THREE.Mesh(new THREE.BoxGeometry(0.18, 1.2, 0.18), woodMat); post.position.set(side*2.95, 0.5, pz); g.add(post); }
    const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, SEG, 6), ropeMat); rope.rotation.x = Math.PI/2; rope.position.set(side*2.95, 1.0, 0); g.add(rope);
  }
  // occasional monastery buildings off to the side
  if (i % 3 === 0){
    const side = Math.random() < 0.5 ? -1 : 1, hgt = rnd(4, 9), wid = rnd(4, 6);
    const b = new THREE.Mesh(new THREE.BoxGeometry(wid, hgt, 5), wallMat); b.position.set(side*(5.5 + wid/2), hgt/2 - 3, rnd(-2, 2)); g.add(b);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(wid + 0.8, 0.35, 5.8), Math.random()<0.4 ? goldMat : roofMat); roof.position.set(b.position.x, hgt - 3 + 0.17, b.position.z); g.add(roof);
  }
  // prayer flags across the path
  if (i % 4 === 2){
    const n = 14;
    for (let k = 0; k < n; k++){
      const u = k/(n-1), x = -3 + u*6, y = 3.6 - Math.sin(u*Math.PI)*0.6;
      const f = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.4), FLAGS[k%5]); f.position.set(x, y - 0.2, 0); f.userData.flag = k; g.add(f);
    }
  }
  g.userData.obs = [];
  world.add(g); return g;
}
function clearObs(g){ for (const o of g.userData.obs){ g.remove(o.mesh); } g.userData.obs = []; }

const barrierGeo = new THREE.BoxGeometry(1.5, 0.22, 0.25);
const pileGeo = new THREE.CylinderGeometry(0.18, 0.18, 1.5, 8);
const lampGeo = new THREE.CylinderGeometry(0.16, 0.1, 0.12, 10);
const lampMat = new THREE.MeshBasicMaterial({ color:'#e0b24a' });
const glowMat = new THREE.SpriteMaterial({ map:lampTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
function addObstacles(g, difficulty){
  const r = Math.random();
  if (r < 0.35){ // barrier to jump over, one or all lanes
    const all = Math.random() < 0.4;
    const lanes = all ? [-1,0,1] : [Math.floor(rnd(3)) - 1];
    for (const l of lanes){
      const m = new THREE.Group();
      const beam = new THREE.Mesh(barrierGeo, woodMat); beam.position.y = 0.55; m.add(beam);
      for (const s of [-0.65, 0.65]){ const leg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.6, 0.12), woodMat); leg.position.set(s, 0.3, 0); m.add(leg); }
      m.position.set(l*LANE, 0, rnd(-2, 2)); g.add(m); g.userData.obs.push({ mesh:m, lane:l, kind:'low' });
    }
  } else if (r < 0.75){ // woodpile blocking one or two lanes
    const free = Math.floor(rnd(3)) - 1;
    const lanes = [-1,0,1].filter(l => l !== free).filter(() => Math.random() < 0.75 || difficulty > 1);
    for (const l of lanes){
      const m = new THREE.Group();
      for (let row = 0; row < 4; row++) for (let k = 0; k < 4 - row; k++){ const log = new THREE.Mesh(pileGeo, woodMat); log.rotation.z = Math.PI/2; log.position.set(0, 0.2 + row*0.34, (k - (3-row)/2)*0.36 * 0 ); log.position.x = 0; log.position.y = 0.18 + row*0.33; log.position.z = (k-(3-row)/2)*0.37; log.rotation.set(0, 0, Math.PI/2); m.add(log); }
      m.position.set(l*LANE, 0, rnd(-1.5, 1.5)); g.add(m); g.userData.obs.push({ mesh:m, lane:l, kind:'tall' });
    }
  }
  // lamps
  if (Math.random() < 0.7){
    const l = Math.floor(rnd(3)) - 1, blocked = g.userData.obs.some(o => o.lane === l && o.kind === 'tall');
    if (!blocked) for (let k = 0; k < 4; k++){
      const m = new THREE.Group();
      const cup = new THREE.Mesh(lampGeo, lampMat); m.add(cup);
      const glow = new THREE.Sprite(glowMat); glow.scale.set(0.9, 0.9, 1); glow.position.y = 0.18; m.add(glow);
      m.position.set(l*LANE, 0.8, -SEG/2 + 1 + k*2); g.add(m); g.userData.obs.push({ mesh:m, lane:l, kind:'lamp' });
    }
  }
}
for (let i = 0; i < NSEG; i++) segs.push(makeSeg(-i*SEG, i));

/* ---------- Tenzin: the cut-out loop on a camera-facing card ---------- */
const COLS = 8, ROWS = 4, FRAMES = 29;
const sheetImg = new Image(); const sheet = new THREE.Texture(sheetImg);
sheetImg.onload = () => { sheet.needsUpdate = true; };
sheetImg.src = document.getElementById('sheetData').textContent.trim();
sheet.encoding = THREE.sRGBEncoding; sheet.repeat.set(1/COLS, 1/ROWS); sheet.minFilter = THREE.LinearFilter; sheet.generateMipmaps = false;
const H = 2.05, W = H * 220/300;
const tenzin = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshBasicMaterial({ map:sheet, transparent:true, alphaTest:0.08, fog:false, depthWrite:false }));
tenzin.renderOrder = 10;
scene.add(tenzin);
const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.5, 24), new THREE.MeshBasicMaterial({ color:'#000', transparent:true, opacity:0.28, depthWrite:false }));
shadow.rotation.x = -Math.PI/2; shadow.scale.set(1, 0.55, 1); shadow.position.y = 0.01; scene.add(shadow);
function setFrame(i){ i = ((i % FRAMES) + FRAMES) % FRAMES; const c = i % COLS, r = Math.floor(i / COLS); sheet.offset.set(c/COLS, 1 - (r+1)/ROWS); }

/* ---------- game state ---------- */
let state = 'ready', speed = 11, dist = 0, lamps = 0, lane = 0, x = 0, y = 0, vy = 0, animT = 0, t = 0, hitT = 0;
function reset(){
  speed = 11; dist = 0; lamps = 0; lane = 0; x = 0; y = 0; vy = 0;
  segs.forEach((g, i) => { g.position.z = -i*SEG; clearObs(g); if (i > 2) addObstacles(g, 0); });
  $('lamps').textContent = 'Lamps 0';
}
function start(){ ac(); reset(); state = 'run'; $('card').hidden = true; canvas.focus?.(); }
function gameOver(){
  state = 'over'; hitT = 0.4; thud();
  $('eyebrow').textContent = 'Tripped'; $('headline').textContent = `${Math.floor(dist)} m`;
  $('msg').textContent = `Tenzin collected ${lamps} butter ${lamps===1?'lamp':'lamps'} before the woodpile got him.`;
  $('go').textContent = 'Run again';
  setTimeout(() => { $('card').hidden = false; $('go').focus(); }, 700);
}
$('go').onclick = start;

/* ---------- input ---------- */
function moveLane(d){ if (state !== 'run') return; lane = Math.max(-1, Math.min(1, lane + d)); whoosh(); }
function jump(){ if (state !== 'run') return; if (y <= 0.001){ vy = 8.6; blip(); } }
addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); moveLane(-1); }
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); moveLane(1); }
  else if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') { e.preventDefault(); if (state === 'run') jump(); else if (!$('card').hidden && document.activeElement !== $('go')) start(); }
  else if (e.code === 'Enter' && state !== 'run' && document.activeElement !== $('go')) start();
});
let sx = 0, sy = 0, st = 0;
addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; st = performance.now(); });
addEventListener('pointerup', e => {
  if (state !== 'run') return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) { jump(); return; }
  if (Math.abs(dx) > Math.abs(dy)) moveLane(dx > 0 ? 1 : -1); else if (dy < 0) jump();
});

/* ---------- sound ---------- */
let AC = null;
function ac(){ if (!AC) try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type='sine', v=0.08, slide=0){ const a = ac(); if (!a) return; const t0 = a.currentTime, o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(f+slide, t0+d); g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+d); o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+d+0.05); }
const blip = () => tone(300, .15, 'triangle', .07, 260), whoosh = () => tone(500, .08, 'sine', .03, -200), chime = () => { tone(1046, .25, 'sine', .06); tone(1568, .3, 'sine', .04); }, thud = () => tone(120, .35, 'triangle', .15, -60);

/* ---------- loop ---------- */
function resize(){
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w/h;
  camera.fov = w/h < 0.8 ? 74 : 60; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now; t += dt;
  if (state === 'run'){
    speed = Math.min(24, speed + dt*0.18);
    const dz = speed*dt; dist += dz;
    for (const g of segs){
      g.position.z += dz;
      if (g.position.z > SEG*1.5){ g.position.z -= NSEG*SEG; clearObs(g); addObstacles(g, dist > 600 ? 2 : dist > 250 ? 1 : 0); }
    }
    for (const p of puffs){ p.position.z += dz*0.4; if (p.position.z > 20) p.position.z -= 180; }
    vy -= 26*dt; y = Math.max(0, y + vy*dt); if (y === 0) vy = 0;
    // collisions
    for (const g of segs) for (const o of g.userData.obs){
      const oz = g.position.z + o.mesh.position.z; if (Math.abs(oz) > 0.45) continue;
      if (Math.abs(o.mesh.position.x - x) > 0.75) continue;
      if (o.kind === 'lamp'){ if (o.mesh.visible){ o.mesh.visible = false; lamps++; $('lamps').textContent = `Lamps ${lamps}`; chime(); } }
      else if (o.kind === 'tall' || (o.kind === 'low' && y < 0.65)) { gameOver(); break; }
    }
    $('score').textContent = `${Math.floor(dist)} m`;
    animT += dt * (speed/11);
  } else if (state === 'ready') animT += dt;
  x += (lane*LANE - x) * Math.min(1, dt*12);
  // Tenzin card
  const airborne = y > 0.05;
  setFrame(airborne ? 9 : Math.floor(animT*30));
  tenzin.position.set(x, H/2 - 0.04 + y, 0.2);
  tenzin.rotation.z = (lane*LANE - x) * -0.12;
  const squash = airborne ? 1 + Math.min(0.06, vy*0.006) : 1;
  tenzin.scale.set(1/squash, squash, 1);
  shadow.position.x = x; const ss = 1 - Math.min(0.5, y*0.25); shadow.scale.set(ss, 0.55*ss, 1);
  if (state === 'over' && hitT > 0){ hitT -= dt; tenzin.material.opacity = 0.5 + 0.5*Math.cos(t*40); } else tenzin.material.opacity = 1;
  // flags flutter
  for (const g of segs) for (const c of g.children) if (c.userData.flag !== undefined) c.rotation.x = Math.sin(t*5 + c.userData.flag)*0.35;
  camera.position.x = x*0.35; camera.lookAt(x*0.25, 1.0, -10);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
reset(); requestAnimationFrame(frame);
window.__run = { get state(){ return state; }, start, moveLane, jump, get dist(){ return dist; } };
})();
</script>
</body></html>
